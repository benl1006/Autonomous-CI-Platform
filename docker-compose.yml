services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  x-ai-common: &ai-common
    build: ./ai_engine
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    build: ./ai_engine
    <<: *ai-common
    ports:
      - "${AI_ENGINE_PORT:-8000}:${AI_ENGINE_PORT:-8000}"
    develop:
      watch:
        - action: rebuild
          path: ./src

  celery-worker:
    build: ./ai_engine
    <<: *ai-common
    command: celery -A app.tasks.workers.celery_app worker --loglevel=info

volumes:
  pgdata:
